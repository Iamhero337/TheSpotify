plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.thespotify.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.thespotify.app"
        minSdk 26        // Android 8.0 — covers 97%+ of active devices
        targetSdk 34     // Required for foregroundServiceType enforcement on API 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // MediaSessionCompat, PlaybackStateCompat, MediaMetadataCompat, MediaStyle notification
    implementation 'androidx.media:media:1.7.0'
}
